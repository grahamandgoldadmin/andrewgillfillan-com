<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">An anonymized private data journalism news desk</title>
  <desc id="desc">A workflow interface showing public records moving through collection, cleaning, evidence review and a human editorial decision.</desc>
  <rect width="1200" height="800" fill="#F2EFE9"/>
  <rect width="258" height="800" fill="#0D1D31"/>
  <text x="42" y="66" fill="#8DE0D1" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">PRIVATE NEWS DESK</text>
  <text x="42" y="116" fill="#7D899A" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORKSPACE</text>
  <rect x="24" y="143" width="210" height="48" rx="5" fill="#173252"/>
  <circle cx="45" cy="167" r="5" fill="#8DE0D1"/>
  <text x="62" y="173" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="700">Live desk</text>
  <text x="42" y="229" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="15">Source health</text>
  <text x="42" y="279" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="15">Data explorer</text>
  <text x="42" y="329" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="15">Evidence queue</text>
  <text x="42" y="379" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="15">Human review</text>
  <rect x="258" y="0" width="942" height="84" fill="#11243D"/>
  <text x="300" y="34" fill="#8DE0D1" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">LIVE PIPELINE</text>
  <rect x="300" y="47" width="130" height="22" rx="11" fill="#1C395D"/>
  <text x="318" y="62" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="10">COLLECTING</text>
  <rect x="440" y="47" width="130" height="22" rx="11" fill="#1C395D"/>
  <text x="459" y="62" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="10">NORMALIZING</text>
  <rect x="580" y="47" width="130" height="22" rx="11" fill="#1C395D"/>
  <text x="602" y="62" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="10">ENRICHING</text>
  <rect x="720" y="47" width="130" height="22" rx="11" fill="#1C395D"/>
  <text x="745" y="62" fill="#D5DBE2" font-family="Arial, sans-serif" font-size="10">CHECKING</text>
  <circle cx="1128" cy="56" r="7" fill="#8DE0D1"/>
  <text x="300" y="130" fill="#2A60C8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">EVIDENCE FIRST</text>
  <text x="300" y="176" fill="#14120F" font-family="Georgia, serif" font-size="42">From raw records to reporting leads.</text>
  <text x="300" y="207" fill="#5D564D" font-family="Arial, sans-serif" font-size="16">Deterministic data work first. Model assistance stays advisory. A human makes the editorial decision.</text>
  <g transform="translate(300 252)">
    <rect width="190" height="130" rx="8" fill="#FFFFFF" stroke="#D3CCC2"/>
    <text x="18" y="28" fill="#A32A19" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">01 · COLLECT</text>
    <text x="18" y="72" fill="#14120F" font-family="Georgia, serif" font-size="33">100K+</text>
    <text x="18" y="100" fill="#5D564D" font-family="Arial, sans-serif" font-size="13">permit records</text>
  </g>
  <path d="M500 317h30" stroke="#A32A19" stroke-width="3"/>
  <path d="M524 309l10 8-10 8" fill="none" stroke="#A32A19" stroke-width="3"/>
  <g transform="translate(544 252)">
    <rect width="190" height="130" rx="8" fill="#FFFFFF" stroke="#D3CCC2"/>
    <text x="18" y="28" fill="#A32A19" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">02 · CLEAN</text>
    <text x="18" y="72" fill="#14120F" font-family="Georgia, serif" font-size="33">80%+</text>
    <text x="18" y="100" fill="#5D564D" font-family="Arial, sans-serif" font-size="13">geocoded records</text>
  </g>
  <path d="M744 317h30" stroke="#A32A19" stroke-width="3"/>
  <path d="M768 309l10 8-10 8" fill="none" stroke="#A32A19" stroke-width="3"/>
  <g transform="translate(788 252)">
    <rect width="190" height="130" rx="8" fill="#FFFFFF" stroke="#D3CCC2"/>
    <text x="18" y="28" fill="#A32A19" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">03 · LINK</text>
    <text x="18" y="72" fill="#14120F" font-family="Georgia, serif" font-size="33">80%+</text>
    <text x="18" y="100" fill="#5D564D" font-family="Arial, sans-serif" font-size="13">parcel-attached</text>
  </g>
  <path d="M988 317h30" stroke="#A32A19" stroke-width="3"/>
  <path d="M1012 309l10 8-10 8" fill="none" stroke="#A32A19" stroke-width="3"/>
  <g transform="translate(1032 252)">
    <rect width="126" height="130" rx="8" fill="#0D1D31"/>
    <text x="16" y="28" fill="#8DE0D1" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">04 · DECIDE</text>
    <text x="16" y="69" fill="#FFFFFF" font-family="Georgia, serif" font-size="24">Human</text>
    <text x="16" y="97" fill="#FFFFFF" font-family="Georgia, serif" font-size="24">gate</text>
  </g>
  <rect x="300" y="430" width="858" height="100" rx="8" fill="#FFFFFF" stroke="#D3CCC2"/>
  <text x="322" y="459" fill="#2A60C8" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">RECORD → CANDIDATE → VERIFIED CHANGE → STORY</text>
  <text x="322" y="493" fill="#14120F" font-family="Arial, sans-serif" font-size="15" font-weight="700">Raw source retained</text>
  <text x="513" y="493" fill="#14120F" font-family="Arial, sans-serif" font-size="15" font-weight="700">Exact joins</text>
  <text x="670" y="493" fill="#14120F" font-family="Arial, sans-serif" font-size="15" font-weight="700">Unknowns stated</text>
  <text x="872" y="493" fill="#14120F" font-family="Arial, sans-serif" font-size="15" font-weight="700">No auto-publish</text>
  <rect x="300" y="573" width="858" height="156" rx="8" fill="#0D1D31"/>
  <text x="324" y="605" fill="#8DE0D1" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">INTEGRATION LAYER</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
    <rect x="324" y="628" width="146" height="58" rx="5" fill="#173252"/><text x="355" y="663">SUPABASE</text>
    <rect x="484" y="628" width="146" height="58" rx="5" fill="#173252"/><text x="507" y="663">DIGITALOCEAN</text>
    <rect x="644" y="628" width="146" height="58" rx="5" fill="#173252"/><text x="666" y="663">GITHUB ACTIONS</text>
    <rect x="804" y="628" width="146" height="58" rx="5" fill="#173252"/><text x="837" y="663">MAILCHIMP</text>
    <rect x="964" y="628" width="170" height="58" rx="5" fill="#173252"/><text x="991" y="654">SOURCE APIS +</text><text x="1003" y="674">AUTOMATION</text>
  </g>
</svg>
